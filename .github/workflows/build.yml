name: Build ImmortalWrt

on:
  push:
    branches: [ "25.12" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses-dev \
          libssl-dev make patch python3 python3-pip python3-ply python3-setuptools \
          unzip wget zlib1g-dev

      - name: Cache feeds
        uses: actions/cache@v3
        with:
          path: feeds
          key: ${{ runner.os }}-feeds-${{ hashFiles('feeds.conf') }}

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Cache download
        uses: actions/cache@v3
        with:
          path: dl
          key: ${{ runner.os }}-dl-${{ hashFiles('feeds.conf') }}
          restore-keys: ${{ runner.os }}-dl-

      - name: Configure firmware
        run: |
          cp -f config/rax3000m-emmc.config .config
          make defconfig

      - name: Build
        run: |
          make -j$(nproc) V=s

      # ---------- 新增：上传到 Artifact（可选，保留用于调试） ----------
      - name: Upload firmware as artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-firmware
          path: bin/targets/mediatek/filogic/

      # ---------- 新增：创建/更新 GitHub Release（滚动版本） ----------
      - name: Create or update rolling release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: rolling                 # 固定标签，每次构建覆盖
          name: Rolling Release             # 发布标题
          prerelease: true                  # 标记为预发布，便于识别
          allow_updates: true               # 允许更新已存在的 release
          files: |
            bin/targets/mediatek/filogic/*  # 上传该目录下所有文件
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
