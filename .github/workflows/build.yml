name: Build ImmortalWrt

on:
  push:
    branches: [ "25.12" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses-dev \
          libssl-dev make patch python3 python3-pip python3-ply python3-setuptools \
          unzip wget zlib1g-dev

      - name: Cache feeds
        uses: actions/cache@v3
        with:
          path: feeds
          key: ${{ runner.os }}-feeds-${{ hashFiles('feeds.conf') }}

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Cache download
        uses: actions/cache@v3
        with:
          path: dl
          key: ${{ runner.os }}-dl-${{ hashFiles('feeds.conf') }}
          restore-keys: ${{ runner.os }}-dl-

      - name: Configure firmware
        run: |
          cp -f config/rax3000m-emmc.config .config
          make defconfig

      - name: Build
        run: |
          make -j$(nproc) V=s

      - name: Upload firmware as artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-firmware
          path: bin/targets/mediatek/filogic/

      - name: Create or update rolling release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: rolling
          name: Rolling Release
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            bin/targets/mediatek/filogic/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
