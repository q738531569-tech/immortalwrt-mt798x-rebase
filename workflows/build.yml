name: Build ImmortalWrt

on:
  workflow_dispatch:
  push:
    branches: [ "25.12-dev" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev gawk git libssl-dev gettext zlib1g-dev swig unzip time rsync python3 python3-pip

      - name: Build firmware
        run: |
          cp -f defconfig/mt7981-ax3000.config .config
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-firmware
          path: bin/targets/mediatek/mt7981/*.bin
